<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f47a20">
  <h1 text-align: center;>Entrar | Gestão de estoque</h1>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f7f9}
    .login-card{width:min(420px,100%);display:grid;gap:14px;padding:28px;background:#fff;border:1px solid #dde5eb;border-radius:16px;box-shadow:0 10px 32px rgba(30,59,82,.08)}
    .login-card h1{margin:0;color:#17324d}.login-card p{margin:0;color:#667583;font-size:13px}
    .login-card label{display:grid;gap:7px;color:#17324d;font-size:12px;font-weight:750}
    .login-card input{width:100%;height:42px;padding:0 11px;border:1px solid #cfd9e1;border-radius:9px}
    .login-error{min-height:18px;color:#d8504f!important}.login-button{height:42px;border:0;border-radius:10px;background:#f47a20;color:#fff;font-weight:750;cursor:pointer}
  </style>
</head>
<body data-page="login">
  <main class="login-screen">
    <form class="login-card" id="loginForm" novalidate>
      <h1>Gestão de estoque</h1>
      <p style="text-align: center;">Acesse com seu e-mail e senha</style></p>
      <label>E-mail<input id="loginEmail" type="email" required autocomplete="username"></label>
      <label>Senha<input id="loginPassword" type="password" required autocomplete="current-password"></label>
      <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>
      <button class="login-button" id="loginButton" type="submit">Entrar</button>
    </form>
    <form>
        <div class="qr_code">
        <h5>Acesse tambem em smartphones e tablets.</h5>
        <img src="qr.png" alt="QR Code de acesso ao sistema" class="mobile-qr"> </p>
        </div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
